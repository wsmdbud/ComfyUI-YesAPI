[project]
name = "comfyui-yesapi"
description = "Full-featured ComfyUI custom nodes for Yesapi (yesapi.online): Image generation & mask editing (Nano-banana / GPT-Image), CSV & directory batch pipelines, async queues, dual-protocol LLM/VLM chat, and video generation."
version = "1.0.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "opencv-python>=4.7.0",
]

[project.urls]
Repository = "https://github.com/wsmdbud/ComfyUI-YesAPI"

[tool.comfy]
PublisherId = "wsmdbud"
DisplayName = "ComfyUI-YesAPI"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
